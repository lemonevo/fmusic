name: Build AppKit DMG

on:
  push:
    branches: [refactor/native-appkit-multiplatform]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appkit-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers
          uname -m

      - name: Build AppKit (Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project fmusic.xcodeproj \
            -scheme fmusic-macOS \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            build

      - name: Package DMG
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/fmusic.app"
          if [ ! -d "$APP" ]; then
            echo "App bundle not found at $APP"
            find build/Build/Products -maxdepth 2 -name "*.app" || true
            exit 1
          fi

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$APP/Contents/Info.plist")
          DMG="fmusic-appkit-${VERSION}-arm64.dmg"

          # Ad-hoc sign with the app's real identifier so MediaRemote identifies it
          # correctly and the downloaded bundle is not reported as damaged.
          codesign --force --deep --sign - \
            --identifier lol.levo.fmusic "$APP"
          codesign --verify --deep --strict "$APP"

          rm -rf dist
          mkdir -p dist
          cp -R "$APP" dist/
          ln -s /Applications dist/Applications

          hdiutil create \
            -volname "fmusic (AppKit)" \
            -srcfolder dist \
            -ov -format UDZO "$DMG"
          ls -lh "$DMG"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"

          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: fmusic-appkit-dmg
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.DMG_PATH }}.sha256
          if-no-files-found: error
          retention-days: 14
