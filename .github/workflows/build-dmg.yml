name: Build macOS DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Build (Mac Catalyst, Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project fmusic.xcodeproj \
            -scheme fmusic \
            -configuration Release \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            build

      - name: Package DMG
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-maccatalyst/fmusic.app"
          if [ ! -d "$APP" ]; then
            echo "App bundle not found at $APP"
            find build/Build/Products -maxdepth 2 -name "*.app" || true
            exit 1
          fi

          # Ad-hoc sign so the bundle is not reported as damaged after download.
          codesign --force --deep --sign - "$APP" || true
          codesign --verify --deep --strict "$APP" || true

          rm -rf dist
          mkdir -p dist
          cp -R "$APP" dist/
          ln -s /Applications dist/Applications

          hdiutil create -volname "fmusic" -srcfolder dist -ov -format UDZO fmusic.dmg
          ls -lh fmusic.dmg
          shasum -a 256 fmusic.dmg | tee fmusic.dmg.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fmusic-dmg
          path: |
            fmusic.dmg
            fmusic.dmg.sha256
          if-no-files-found: error

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fmusic.dmg
            fmusic.dmg.sha256
